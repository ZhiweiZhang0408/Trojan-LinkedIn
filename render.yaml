# Render Blueprint: New > Blueprint > pick this repo. Free plan sleeps after ~15 min idle.
services:
  - type: web
    name: trojan-link
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false  # don't redeploy (and reset demo data) on every push
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false  # entered in the Render dashboard; AI buttons return 503 without it
